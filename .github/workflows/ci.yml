
name: BHSim API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  
    docker:
      name: Docker Build and Smoke Test
      needs: test
      runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bhsim-api:ci .

      - name: Start API container
        run: |
          docker run -d \
            --name bhsim-api-test \
            -p 127.0.0.1:8000:8000 \
            bhsim-api:ci

      - name: Verify API health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo ""
              echo "Docker smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Docker smoke test failed"
          docker logs bhsim-api-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f bhsim-api-test || true
